# Overrides the shipped Agent Team row. A patch that names an existing id
# replaces that row's whole `config`, so every field is restated here; keep them
# in sync with the host's agent-team schema when DSH changes.
#
# default -> this bundle
#   maxMembers        16  -> 32
#   maxTasks         256  -> 512
#   maxMessageBytes 65536 -> 131072
#   disposalTimeoutMs 5000 -> 5000 (unchanged)
- id: agent-team
  config:
    maxMembers: 32
    maxTasks: 512
    maxMessageBytes: 131072
    disposalTimeoutMs: 5000
