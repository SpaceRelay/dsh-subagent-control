# A settings-page bundle. The inserted row is the host half: it declares the
# four limits as Config and pushes the chosen values onto the shipped
# `agent-team` row through the config editor. The client half (dsh.client)
# renders the page under Settings → Team limits.
#
# The limits are no longer frozen here: everything the page saves is written
# into the profile patch layer by the config editor, so this file stays free of
# values and survives a DSH upgrade that changes the agent-team defaults.
- insert:
    - id: team-limits
      name: 'dsh-team-limits'
